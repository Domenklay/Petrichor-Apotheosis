name: Apply 0.8.1 hotfix

on:
  push:
    branches: [ fix/0.8.1-early-progression-live-xp ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source hotfix
        run: python3 tools/apply_081_hotfix.py
      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_081_hotfix.py
          git add -A
          git commit -m "Apply Petrichor: Apotheosis 0.8.1 hotfix [skip hotfix]"
          git push origin HEAD:fix/0.8.1-early-progression-live-xp
