name: Bootstrap Petrichor Apotheosis source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize clean source tree
        shell: bash
        run: |
          rm -rf /tmp/apotheosis-bootstrap
          mkdir -p /tmp/apotheosis-bootstrap
          unzip -q bootstrap-source.zip -d /tmp/apotheosis-bootstrap
          cp -a /tmp/apotheosis-bootstrap/. .
          rm -f bootstrap-source.zip .github/workflows/bootstrap.yml

      - name: Commit materialized repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Petrichor: Apotheosis 0.8.0 source [skip ci] [skip bootstrap]"
          git push origin HEAD:main
